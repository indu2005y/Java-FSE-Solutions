<h2>Enrolled Courses</h2>

<div *ngIf="enrolledCourses.length > 0; else empty">

  <div *ngFor="let course of enrolledCourses">

    <h3>{{course.name}}</h3>

    <p>
      Course Code: {{course.code}}
    </p>

    <p>
      Credits: {{course.credits}}
    </p>

  </div>

</div>


<ng-template #empty>

No courses enrolled.

</ng-template>
